<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهامي اليومية</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 40px 15px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
    }

    .date {
      text-align: center;
      color: gray;
      margin-bottom: 25px;
    }

    .add-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }

    .add-btn {
      background: #111827;
      color: white;
    }

    ul {
      padding: 0;
      margin-top: 25px;
    }

    li {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    .task {
      flex: 1;
      font-size: 17px;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .check {
      background: #dcfce7;
    }

    .delete {
      background: #fee2e2;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📋 مهامي اليومية</h1>

    <div class="date" id="date"></div>

    <div class="add-box">
      <input id="taskInput" placeholder="اكتب مهمتك هنا...">
      <button class="add-btn" onclick="addTask()">إضافة</button>
    </div>

    <ul id="taskList"></ul>

  </div>

  <script>
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");

    document.getElementById("date").textContent =
      new Date().toLocaleDateString("ar-JO", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

    function addTask() {
      const text = input.value.trim();

      if (text === "") return;

      const li = document.createElement("li");

      const task = document.createElement("span");
      task.className = "task";
      task.textContent = text;

      const check = document.createElement("button");
      check.className = "check";
      check.textContent = "✓";

      check.onclick = function() {
        task.classList.toggle("done");
      };

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete";
      deleteButton.textContent = "🗑️";

      deleteButton.onclick = function() {
        li.remove();
      };

      li.appendChild(task);
      li.appendChild(check);
      li.appendChild(deleteButton);

      list.appendChild(li);

      input.value = "";
      input.focus();
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
