<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مهامي اليومية</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f5f9;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
    }

    input {
      padding: 12px;
      width: 60%;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .add {
      background: black;
      color: white;
    }

    li {
      list-style: none;
      background: #eee;
      margin: 10px;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📋 مهامي اليومية</h1>

    <input id="taskInput" placeholder="اكتب مهمتك هنا">

    <button class="add" onclick="addTask()">
      إضافة
    </button>

    <ul id="tasks"></ul>

  </div>

  <script>
    function addTask() {

      let input = document.getElementById("taskInput");
      let task = input.value;

      if (task === "") return;

      let li = document.createElement("li");

      li.innerHTML = `
        <span>${task}</span>
        <button onclick="completeTask(this)">✓</button>
      `;

      document.getElementById("tasks").appendChild(li);

      input.value = "";
    }

    function completeTask(button) {

      let task = button.parentElement.querySelector("span");

      task.classList.toggle("done");

    }
  </script>

</body>
</html>
